[workspace]
members = ["components/release", "components/updater", "tools/xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
anyhow = "1.0"
fs2 = "0.4"
libc = "0.2"
plist = "1.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
stainless-release = { path = "components/release" }
tempfile = "3.23"
url = { version = "2.5", features = ["serde"] }
zeroize = "1.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"
